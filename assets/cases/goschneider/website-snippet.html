<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>goSchneider – Website-Ausschnitt</title><link rel="stylesheet" href="website.css"><style>@font-face{font-family:Fraunces;src:url(fraunces.woff2);font-weight:100 900}@font-face{font-family:Montserrat;src:url(montserrat.woff2);font-weight:100 900}body{overflow:hidden}header{background:#f4f0e4;padding:20px 4%;display:flex;align-items:center;justify-content:space-between}header img{width:100px;height:54px;object-fit:contain}header span{font:500 12px Montserrat,sans-serif}.hero{min-height:660px;height:calc(100vh - 94px)}@media(max-width:600px){header span{display:none}.hero{min-height:620px}}</style></head><body><header><img src="logo.svg" alt="goSchneider"><span>Einlagen &nbsp;&nbsp; So funktioniert’s &nbsp;&nbsp; Warum Go Schneider &nbsp;&nbsp; FAQ</span></header><section class="hero hero--craft" id="hero">
  <!-- Prio 1: Handwerks-Motiv vollflaechig -->
  <div class="hero__bg" aria-hidden="true">
    <img src="hero.webp" alt="" width="2560" height="1703" fetchpriority="high" />
  </div>
  <!-- Zwei getrennte Boxen rechts unten: Headline-Box + Copy-Box (mit Packshot links) -->
  <div class="container hero__craft-inner">
    <div class="hero__craft-stack">
      <div class="hero__card hero__craft-headline">
        <h1 class="hero__title">Deine Einlagen.<br />Vom Meister <br class="br-m" />gemacht.<br />Online bestellt.</h1>
      </div>
      <div class="hero__card hero__craft-copy">
        <!-- Prio 2: Packshot links neben Copy + CTAs -->
        <figure class="hero__craft-shot">
          <img src="insole.webp" alt="Ein Paar handgefertigte Einlagen von Go Schneider" loading="eager" />
        </figure>
        <div class="hero__craft-copytext">
          <p class="hero__sub"><strong>Ohne Termin, ohne Wartezimmer.</strong> Dein Abdruckset kommt nach Hause – deine Einlagen entstehen in unserer Werkstatt.</p>
          <div class="hero__actions">
            <a aria-disabled="true" tabindex="-1" data-order-disabled title="Bestellung derzeit pausiert" class="btn btn-dark btn-lg">Einlagen bestellen<span class="btn__arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span><span class="btn__price">ab&nbsp;129&nbsp;€</span></a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

</body></html>
