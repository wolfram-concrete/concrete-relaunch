name: Website preflight

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SEO gauntlet
        run: python3 tools/seo-gauntlet.py
      - name: Technical preflight
        run: python3 tools/technical-preflight.py
